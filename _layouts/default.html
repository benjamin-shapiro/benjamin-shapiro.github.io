<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}

  <body class="{% if page.layout %}layout-{{ page.layout | slugify }}{% endif %}{% if page.body_class %} {{ page.body_class }}{% endif %}">
    {%- include header.html -%}

    <main class="site-main" aria-label="Content">
      {{ content }}
    </main>

    {%- include footer.html -%}
  </body>
</html>
